# Installateur (Anaconda) : profil de Thomas OS. Repris du profil de Bazzite.
# Thomas OS garde ID=bazzite dans os-release (pour les outils de Bazzite) : c'est ce qui choisit ce profil.

[Profile]
profile_id = thomas-os

[Profile Detection]
os_id = bazzite

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
hidden_webui_pages =
    network

[Localization]
use_geolocation = False
