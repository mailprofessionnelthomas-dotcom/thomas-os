<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Thomas OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100..700&family=JetBrains+Mono:wght@100..800&family=Manrope:wght@200..800&family=Nunito:wght@200..1000&family=Open+Sans:wght@300..800&family=Outfit:wght@100..900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1116;--pan:#161a21;--pan2:#1d222b;--bord:#2a303b;--txt:#e8ecf2;--dim:#8b95a5;--acc:#ff3b3b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.35 Manrope,system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--pan);border-bottom:1px solid var(--bord);flex-wrap:wrap}
header b{font-weight:600;letter-spacing:.08em;margin-right:6px}
button,select,input{font:inherit;color:var(--txt);background:var(--pan2);border:1px solid var(--bord);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:#465063}button:disabled{opacity:.4;cursor:default}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.prim{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
main{flex:1;display:flex;min-height:0}
#scene{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;min-width:0;min-height:0}
canvas{max-width:100%;max-height:100%;box-shadow:0 10px 40px #0008;border-radius:4px;background:#000;user-select:none}
aside{width:340px;background:var(--pan);border-left:1px solid var(--bord);display:flex;flex-direction:column;min-height:0}
#onglets{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--bord)}
#onglets button{padding:4px 8px;font-size:12px}
#insp{flex:1;overflow:auto;padding:2px 12px 18px}
.l{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
.l>span{color:var(--dim);flex:0 0 auto}
.l input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.l output{width:46px;text-align:right;font-variant-numeric:tabular-nums}
.l input[type=color]{width:46px;height:26px;padding:1px}
.l select{max-width:190px}
.seg{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:3px 7px;font-size:12px}
h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:30px;padding:4px;border:1px dashed var(--bord);border-radius:6px}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;background:var(--pan2);border:1px solid var(--bord);font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.note{color:var(--dim);font-size:12px;margin:6px 0}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pal button{height:48px;padding:4px 6px;font-size:11px;text-align:left;display:flex;align-items:flex-end;color:#fff;text-shadow:0 1px 2px #000}
#ctx{position:fixed;display:none;min-width:210px;max-height:80vh;overflow:auto;background:#1b2029;border:1px solid var(--bord);border-radius:8px;padding:4px;box-shadow:0 8px 30px #000a;z-index:9}
#ctx div{padding:6px 10px;border-radius:5px;cursor:pointer;white-space:nowrap}
#ctx div:hover{background:#2a3140}#ctx .t{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:default;padding-top:8px}#ctx .t:hover{background:none}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1b2029;border:1px solid var(--bord);padding:7px 14px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
@media (max-width:900px){main{flex-direction:column}aside{width:auto;height:45%;border-left:0;border-top:1px solid var(--bord)}}
</style>
</head>
<body>
<header>
  <b>STUDIO THOMAS OS</b>
  <select id="selDesign" title="Tes designs"></select>
  <input id="nom" size="15" title="Nom du style (proposé sur l'écran de bienvenue)">
  <span id="fic" class="note"></span>
  <button id="bNouv">Nouveau</button><button id="bDup">Dupliquer</button><button id="bSupp">Supprimer</button>
  <span style="flex:1"></span>
  <button id="bUndo" title="Annuler (Ctrl+Z)">↶</button><button id="bRedo" title="Rétablir (Ctrl+Y)">↷</button>
  <button id="bGrille" title="Grille d'alignement">Grille</button><button id="bAimant" title="Aligne tout seul sur les bords et les autres widgets">Magnétisme</button>
  <button id="bReset">Réinitialiser</button><button id="bImport">Importer</button>
  <button id="bSave" class="prim" title="Écrit le design (.json) et sa capture (.png) dans studio/designs">Enregistrer</button>
  <input type="file" id="fJson" accept=".json" hidden><input type="file" id="fImg" accept="image/*" hidden>
</header>
<main>
  <div id="scene"><canvas id="cv" width="1920" height="1080"></canvas></div>
  <aside><div id="onglets"></div><div id="insp"></div></aside>
</main>
<div id="ctx"></div><div id="toast"></div>
<script>
"use strict";
const W=1920,H=1080,$=s=>document.querySelector(s);
// Les 12 styles du système (copiés depuis system_files/usr/share/thomas-os/styles par thomas-style exporter-styles)
const STYLES=/*STYLES*/{"catppuccin": {"nom": "Catppuccin", "principale": "#cba6f7", "barre": "#181825", "fenetres": "#1e1e2e", "texte": "#cdd6f4", "fond_haut": "#1e1e2e", "fond_bas": "#45475a", "opacite": "90", "opacite_menus": "95", "flou": "8", "coins": "10", "animations": "rapides", "epaisseur": "28", "disposition": "windows", "police": "nunito", "taille": "12", "epaisseur_texte": "400", "horloge": "oui"}, "dracula": {"nom": "Dracula", "principale": "#bd93f9", "barre": "#21222c", "fenetres": "#282a36", "texte": "#f8f8f2", "fond_haut": "#21222c", "fond_bas": "#44475a", "opacite": "100", "opacite_menus": "100", "flou": "0", "coins": "6", "animations": "rapides", "epaisseur": "28", "disposition": "windows", "police": "plex", "taille": "12", "epaisseur_texte": "400", "horloge": "oui"}, "fluent": {"nom": "Fluent / Windows 11", "principale": "#4cc2ff", "barre": "#202020", "fenetres": "#202020", "texte": "#ffffff", "fond_haut": "#3d8bff", "fond_bas": "#081a3a", "opacite": "90", "opacite_menus": "95", "flou": "10", "coins": "8", "animations": "rapides", "epaisseur": "28", "disposition": "windows", "police": "open", "taille": "12", "epaisseur_texte": "400", "horloge": "oui"}, "glass": {"nom": "Glassmorphism", "principale": "#d08cff", "barre": "#2a1a44", "fenetres": "#1c1430", "texte": "#fbf6ff", "fond_haut": "#3a0f5c", "fond_bas": "#1c3f8f", "opacite": "30", "opacite_menus": "80", "flou": "18", "coins": "12", "animations": "rapides", "epaisseur": "28", "disposition": "windows", "police": "outfit", "taille": "12", "epaisseur_texte": "400", "horloge": "oui"}, "liquid": {"nom": "Liquid Glass", "principale": "#2b7bff", "barre": "#ffffff", "fenetres": "#f4f7ff", "texte": "#0d1424", "fond_haut": "#ff9ec7", "fond_bas": "#7fd3ff", "opacite": "32", "opacite_menus": "75", "flou": "28", "coins": "16", "animations": "rapides", "epaisseur": "28", "disposition": "windows", "police": "manrope", "taille": "12", "epaisseur_texte": "400", "horloge": "oui"}, "macos": {"nom": "macOS", "principale": "#0a7cff", "barre": "#f6f6f6", "fenetres": "#fafafa", "texte": "#1d1d1f", "fond_haut": "#f7b267", "fond_bas": "#7b5ea7", "opacite": "68", "opacite_menus": "85", "flou": "20", "coins": "12", "animations": "rapides", "epaisseur": "28", "disposition": "macos", "police": "manrope", "taille": "12", "epaisseur_texte": "400", "horloge": "oui"}, "material": {"nom": "Material You", "principale": "#3c6a2e", "barre": "#dfe9d8", "fenetres": "#f4f8ef", "texte": "#1a1c18", "fond_haut": "#a8c69f", "fond_bas": "#2f4f3a", "opacite": "100", "opacite_menus": "100", "flou": "0", "coins": "18", "animations": "rapides", "epaisseur": "28", "disposition": "windows", "police": "nunito", "taille": "12", "epaisseur_texte": "400", "horloge": "oui"}, "minimal": {"nom": "Minimal", "principale": "#3a3a3a", "barre": "#ffffff", "fenetres": "#ffffff", "texte": "#1f1f1f", "fond_haut": "#ececea", "fond_bas": "#ececea", "opacite": "100", "opacite_menus": "100", "flou": "0", "coins": "4", "animations": "rapides", "epaisseur": "28", "disposition": "windows", "police": "plex", "taille": "12", "epaisseur_texte": "400", "horloge": "oui"}, "neon": {"nom": "Néon / Gaming", "principale": "#00f0ff", "barre": "#080812", "fenetres": "#0a0a16", "texte": "#e8fbff", "fond_haut": "#06060c", "fond_bas": "#1a0326", "opacite": "88", "opacite_menus": "92", "flou": "6", "coins": "4", "animations": "rapides", "epaisseur": "28", "disposition": "windows", "police": "rajdhani", "taille": "13", "epaisseur_texte": "400", "horloge": "oui"}, "nord": {"nom": "Nord", "principale": "#88c0d0", "barre": "#3b4252", "fenetres": "#2e3440", "texte": "#eceff4", "fond_haut": "#2e3440", "fond_bas": "#5e81ac", "opacite": "100", "opacite_menus": "100", "flou": "0", "coins": "6", "animations": "rapides", "epaisseur": "28", "disposition": "windows", "police": "plex", "taille": "12", "epaisseur_texte": "400", "horloge": "oui"}, "perf": {"nom": "Performance", "principale": "#3daee9", "barre": "#121316", "fenetres": "#24262b", "texte": "#e6e6e6", "fond_haut": "#1b1d21", "fond_bas": "#1b1d21", "opacite": "100", "opacite_menus": "100", "flou": "0", "coins": "0", "animations": "aucune", "epaisseur": "28", "disposition": "windows", "police": "open", "taille": "12", "epaisseur_texte": "400", "horloge": "oui"}, "thomas": {"nom": "Thomas OS", "principale": "#ff0000", "barre": "#ff0000", "fenetres": "#000000", "texte": "#f2f5f9", "fond_haut": "#1f5f99", "fond_bas": "#08131f", "opacite": "15", "opacite_menus": "85", "flou": "0", "coins": "8", "animations": "rapides", "epaisseur": "28", "disposition": "windows", "police": "manrope", "taille": "12", "epaisseur_texte": "300", "horloge": "oui"}}/*FIN*/;
const POLICES={manrope:'Manrope',open:'Open Sans',outfit:'Outfit',nunito:'Nunito',plex:'IBM Plex Sans',rajdhani:'Rajdhani',mono:'JetBrains Mono'};
// Applis réellement présentes dans Thomas OS (id = nom du fichier .desktop)
const APPS={'org.kde.dolphin':['Dolphin','#1d99f3','D'],'com.opera.opera-gx':['Opera GX','#fa1e4e','O'],'org.mozilla.firefox':['Firefox','#ff7139','F'],
 'com.spotify.Client':['Spotify','#1db954','♪'],'com.microsoft.VSCode':['VS Code','#2489ca','</>'],'org.kde.konsole':['Konsole','#2c3e50','>_'],
 'systemsettings':['Paramètres','#6c7a89','⚙'],'io.github.kolunmi.Bazaar':['Bazaar','#9b59b6','B'],'org.libreoffice.LibreOffice':['LibreOffice','#18a303','L'],
 'org.videolan.VLC':['VLC','#ff8800','▶'],'org.kde.gwenview':['Gwenview','#3daee9','▣'],'org.kde.okular':['Okular','#da4453','◧'],
 'org.kde.kcalc':['KCalc','#566573','='],'com.github.tchx84.Flatseal':['Flatseal','#4a90d9','✓'],'io.github.flattool.Warehouse':['Warehouse','#e67e22','W'],
 'io.github.DenysMb.Kontainer':['Kontainer','#16a085','K']};
const SPEC={home:['Dossier perso','#3daee9','⌂'],trash:['Corbeille','#7f8c8d','✕']};
const EPINGLES=['org.kde.dolphin','com.opera.opera-gx','org.mozilla.firefox','com.spotify.Client','com.microsoft.VSCode','org.kde.konsole','systemsettings'];
const FAVORIS=['org.kde.dolphin','com.opera.opera-gx','org.mozilla.firefox','com.spotify.Client','com.microsoft.VSCode','org.kde.konsole','org.libreoffice.LibreOffice','org.videolan.VLC','org.kde.gwenview','org.kde.okular','org.kde.kcalc','systemsettings'];
// Widgets KDE Plasma réels (le moteur les traduit en vrais plugins)
const WID={'horloge-thomas':{n:'Horloge Thomas OS',l:620,h:170,ml:300,mh:110,fond:0},'horloge':{n:'Horloge numérique',l:300,h:120,ml:160,mh:70,fond:1},
 'horloge-analogique':{n:'Horloge à aiguilles',l:200,h:200,ml:120,mh:120,fond:0},'meteo':{n:'Météo',l:320,h:200,ml:220,mh:140,fond:1},
 'cpu':{n:'Processeur',l:300,h:180,ml:180,mh:120,fond:1},'memoire':{n:'Mémoire',l:300,h:180,ml:180,mh:120,fond:1},'reseau':{n:'Réseau',l:300,h:180,ml:180,mh:120,fond:1},
 'musique':{n:'Lecteur de musique',l:360,h:150,ml:240,mh:100,fond:1},'notes':{n:'Pense-bête',l:260,h:260,ml:160,mh:160,fond:0}};
const BOUTONS={M:'Menu',S:'Tous les bureaux',F:'Au premier plan',H:'Aide',I:'Réduire',A:'Agrandir',X:'Fermer'};
const OMBRES={aucune:0,petite:14,moyenne:28,grande:44,enorme:64},NOM_OMBRES={aucune:'Aucune',petite:'Petite',moyenne:'Moyenne',grande:'Grande',enorme:'Énorme'};
const TI=[16,22,32,48,64,128];
const ICONES={'breeze-dark':'Breeze sombre',breeze:'Breeze clair','Papirus-Dark':'Papirus sombre',Papirus:'Papirus clair'};
const CURSEURS={breeze_cursors:'Breeze',Breeze_Light:'Breeze clair',Adwaita:'Adwaita'};

// ---------- outils ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgba=(h,a)=>`rgba(${hx(h).join(',')},${a})`;
const mixh=(a,b,t)=>{const B=hx(b);return'#'+hx(a).map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const lum=h=>{const[r,g,b]=hx(h);return(.2126*r+.7152*g+.0722*b)/255};
const uid=()=>Math.random().toString(36).slice(2,9);
const tpx=d=>(d.texte.taille-2)*4/3;
const FT=(d,px,w)=>`${w||d.texte.epaisseur_texte} ${Math.round(px*10)/10}px "${POLICES[d.texte.police]}", sans-serif`;
const nomApp=id=>(APPS[id]||SPEC[id]||[id])[0];
function el(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x.startsWith('on'))e[x]=v;else e.setAttribute(x,v)}for(const c of k)if(c!=null)e.append(c);return e}
function texte(c,s,x,y,font,col,al='left',bl='middle'){c.font=font;c.fillStyle=col;c.textAlign=al;c.textBaseline=bl;c.fillText(s,x,y)}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function ellipse(c,s,max,font){c.font=font;if(c.measureText(s).width<=max)return s;while(s.length>1&&c.measureText(s+'…').width>max)s=s.slice(0,-1);return s+'…'}
function fusion(b,o){for(const[k,v]of Object.entries(o||{})){if(v&&typeof v==='object'&&!Array.isArray(v)&&b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))fusion(b[k],v);else b[k]=v}return b}
const heure=()=>new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

// ---------- designs ----------
function nouveau(sid){const p=STYLES[sid]||STYLES.thomas||Object.values(STYLES)[0],dis=p.disposition,sombre=lum(p.fenetres)<.5;
 return{format:'thomas-os-studio',version:1,base:sid,nom:p.nom,
  couleurs:{mode:sombre?'sombre':'clair',principale:p.principale,barre:p.barre,fenetres:p.fenetres,texte:p.texte},
  fond:{type:'degrade',haut:p.fond_haut,bas:p.fond_bas,fichier:''},
  effets:{opacite:+p.opacite,opacite_menus:+p.opacite_menus,flou:+p.flou,coins:+p.coins,animations:p.animations},
  barre:{bord:dis==='vertical'?'gauche':'bas',flottante:dis==='float'||dis==='macos',longueur:dis==='float'||dis==='macos'?'ajustee':'pleine',
   alignement:dis==='vertical'?'gauche':'centre',epaisseur:Math.min(44,+p.epaisseur+(dis==='macos'?12:dis==='vertical'?6:0)),masquage:'non',
   epingles:[...EPINGLES],bureaux:false,afficher_bureau:false,date:true,barre_haut:dis==='macos'},
  menu:{type:'kickoff',largeur:640,hauteur:560,favoris:'grille',cote:'gauche',epingles:[...FAVORIS]},
  bureau:{icones:true,taille_icones:3,icones_liste:[],widgets:p.horloge==='non'?[]:[{type:'horloge-thomas',x:48,y:40,l:620,h:170}]},
  fenetres:{boutons_gauche:'M',boutons_droite:'IAX',coins:+p.coins,opacite_inactive:100,opacite_deplacement:100,ombre:'moyenne',force_ombre:50,x:470,y:200,l:980,h:600},
  texte:{police:p.police,taille:+p.taille,epaisseur_texte:+p.epaisseur_texte},
  systeme:{icones:sombre?'breeze-dark':'breeze',curseur:'breeze_cursors',taille_curseur:24}}}
let S={designs:{},actif:null},ui={tab:'barre',sel:null,menu:false,grille:false,aimant:true,deplacement:false},undo=[],redo=[],snap=null;const IMG={};
const D=()=>S.designs[S.actif];
function sauver(){try{localStorage.setItem('studio-thomas-os',JSON.stringify(S))}catch(e){toast('Mémoire du navigateur pleine : enregistre ton design')}}
function charger(){try{const j=JSON.parse(localStorage.getItem('studio-thomas-os'));if(j&&j.designs&&Object.keys(j.designs).length)S=j}catch(e){}
 for(const[u,d]of Object.entries(S.designs))S.designs[u]=fusion(nouveau(STYLES[d.base]?d.base:'thomas'),d);
 if(!S.actif||!S.designs[S.actif]){S.actif=Object.keys(S.designs)[0];if(!S.actif){S.actif=uid();S.designs[S.actif]=nouveau('thomas')}}}
function commit(){const j=JSON.stringify(D());if(j!==snap){if(snap)undo.push(snap);if(undo.length>150)undo.shift();redo=[];snap=j;sauver()}majUI()}
function bouger(de,vers){if(!de.length)return;vers.push(snap);snap=de.pop();S.designs[S.actif]=JSON.parse(snap);sauver();cacheFond=null;majUI();inspecteur();polices();rendre()}
const annuler=()=>bouger(undo,redo),retablir=()=>bouger(redo,undo);
function idDe(d){const n=(d.nom||'').trim().toLowerCase();for(const[k,v]of Object.entries(STYLES))if(v.nom.toLowerCase()===n||k===n)return k;
 return n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'perso'}
function chargerImg(nom,url){const im=new Image();im.onload=()=>{cacheFond=null;rendre()};im.src=url;IMG[nom]=im}

// ---------- géométrie (même calcul que le moteur) ----------
const clockPx=T=>T>=40?Math.round(T*.36):Math.round(Math.min(16,T*.46));
// Horloge de la barre (vu sur le vrai KDE) : avec la date, heure et date l'une sous l'autre, même dans une barre fine
const clockPx2=T=>Math.round(Math.max(9,T*.38));
function largHorloge(d,T){const c=cx;if(!d.barre.date){c.font=FT(d,clockPx(T));return Math.round(c.measureText('00:00').width+16)}
 c.font=FT(d,clockPx2(T));return Math.round(Math.max(c.measureText('00:00').width,c.measureText('22/11/2026').width)+16)}
function geo(d){const b=d.barre,T=b.epaisseur,v=b.bord==='gauche'||b.bord==='droite',g=b.flottante?8:0,haut=b.barre_haut&&b.bord!=='haut',lw=Math.round(T*1.25),gs=Math.round(T*.78);
 const ga=[{k:'kickoff',l:lw}];b.epingles.forEach((id,i)=>ga.push({k:'lanceur',i,id,l:lw}));if(b.bureaux)ga.push({k:'pager',l:Math.round(T*(v?1.6:2.6))});
 const dr=[];if(!haut){dr.push({k:'tray',l:gs*4+8});dr.push({k:'horloge',l:v?Math.round(T*1.3):largHorloge(d,T)})}if(b.afficher_bureau)dr.push({k:'montrer',l:Math.round(T*.45)});

// ---------- haut de page ----------
function majUI(){const s=$('#selDesign');s.innerHTML='';for(const[u,d]of Object.entries(S.designs)){const o=el('option',{value:u},d.nom||'(sans nom)');if(u===S.actif)o.selected=true;s.append(o)}
 const d=D(),id=idDe(d);if(document.activeElement!==$('#nom'))$('#nom').value=d.nom;$('#fic').textContent=`→ ${id}.json${STYLES[id]?' (remplace « '+STYLES[id].nom+' »)':''}`;$('#bUndo').disabled=!undo.length;$('#bRedo').disabled=!redo.length}
function boutonsEtat(){$('#bGrille').classList.toggle('on',ui.grille);$('#bAimant').classList.toggle('on',ui.aimant)}
function changerDesign(){undo=[];redo=[];snap=JSON.stringify(D());ui.sel=null;cacheFond=null;sauver();majUI();inspecteur();polices();rendre()}
function creer(d){const u=uid();let n=d.nom,i=2;const noms=Object.values(S.designs).map(x=>x.nom);while(noms.includes(n))n=d.nom+' '+i++;d.nom=n;S.designs[u]=d;S.actif=u;changerDesign()}
$('#selDesign').onchange=e=>{S.actif=e.target.value;changerDesign()};
$('#nom').oninput=e=>{D().nom=e.target.value;majUI()};$('#nom').onchange=commit;
$('#bNouv').onclick=e=>{const r=e.target.getBoundingClientRect();ouvrirCtx(r.left,r.bottom+4,['Partir du style…',...Object.entries(STYLES).map(([k,p])=>[p.nom,()=>creer(nouveau(k))])])};
$('#bDup').onclick=()=>creer(JSON.parse(JSON.stringify(D())));
$('#bSupp').onclick=()=>{if(Object.keys(S.designs).length<2)return toast('Il faut garder au moins un design');if(!confirm(`Supprimer « ${D().nom} » du Studio ? (les fichiers déjà enregistrés restent)`))return;delete S.designs[S.actif];S.actif=Object.keys(S.designs)[0];changerDesign()};
$('#bUndo').onclick=annuler;$('#bRedo').onclick=retablir;
$('#bGrille').onclick=()=>{ui.grille=!ui.grille;boutonsEtat();rendre()};$('#bAimant').onclick=()=>{ui.aimant=!ui.aimant;boutonsEtat()};
$('#bReset').onclick=()=>{const d=D(),n=nouveau(d.base||'thomas');n.nom=d.nom;S.designs[S.actif]=n;ui.sel=null;cacheFond=null;maj();polices();toast('Design remis à zéro (Ctrl+Z pour revenir)')};
$('#bImport').onclick=()=>$('#fJson').click();
$('#fJson').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(j.format!=='thomas-os-studio')throw 0;const d=fusion(nouveau(STYLES[j.base]?j.base:'thomas'),j);delete d.id;delete d.corrections;
 if(d.fond.type==='image'&&!IMG[d.fond.fichier])d.fond.type='degrade';const ex=Object.keys(S.designs).find(u=>S.designs[u].nom===d.nom);if(ex){S.designs[ex]=d;S.actif=ex;changerDesign()}else creer(d);toast('Design importé')}catch(x){toast('Ce fichier n’est pas un design du Studio')}};
$('#fImg').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();im.onload=()=>{const r=Math.min(1,2560/im.naturalWidth,1440/im.naturalHeight),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 const url=c.toDataURL('image/jpeg',.86),nom='img-'+Date.now().toString(36);try{localStorage.setItem('studio-img:'+nom,url)}catch(x){return toast('Image trop lourde pour la mémoire du navigateur')}chargerImg(nom,url);const d=D();d.fond.type='image';d.fond.fichier=nom;cacheFond=null;maj()};im.src=URL.createObjectURL(f)};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;const k=e.key.toLowerCase();

// ---------- enregistrement ----------
let dirH=null,tt;
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,5000)}
function idb(mode,fn){return new Promise((res,rej)=>{const o=indexedDB.open('studio-thomas-os',1);o.onupgradeneeded=()=>o.result.createObjectStore('h');o.onerror=()=>rej(o.error);
 o.onsuccess=()=>{const t=o.result.transaction('h',mode),r=fn(t.objectStore('h'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}})}
async function dossier(nouveauDossier){if(!window.showDirectoryPicker)throw new Error('non');if(!dirH&&!nouveauDossier)try{dirH=await idb('readonly',s=>s.get('dir'))}catch(e){}
 if(dirH&&!nouveauDossier){if(await dirH.queryPermission({mode:'readwrite'})==='granted'||await dirH.requestPermission({mode:'readwrite'})==='granted')return dirH}
 toast('Choisis le dossier : Thomas OS projet → studio → designs');dirH=await window.showDirectoryPicker({id:'studio-designs',mode:'readwrite'});try{await idb('readwrite',s=>s.put(dirH,'dir'))}catch(e){}return dirH}
async function enregistrer(e){const d=D(),id=idDe(d),out=JSON.parse(JSON.stringify(d));out.id=id;out.ecran={l:W,h:H};out.enregistre=new Date().toISOString();let img=null;
 if(d.fond.type==='image'&&IMG[d.fond.fichier]){const u=IMG[d.fond.fichier].src;out.fond.fichier=id+'-fond.jpg';img=await(await fetch(u)).blob()}
 const c=document.createElement('canvas');c.width=W;c.height=H;dessiner(c.getContext('2d'),true);rendre();const png=await new Promise(r=>c.toBlob(r,'image/png'));
 const fics=[[id+'.json',new Blob([JSON.stringify(out,null,2)],{type:'application/json'})],[id+'.png',png]];if(img)fics.push([out.fond.fichier,img]);
 try{const dir=await dossier(e&&e.shiftKey);for(const[n,b]of fics){const w=await(await dir.getFileHandle(n,{create:true})).createWritable();await w.write(b);await w.close()}
  toast(`✓ Enregistré dans « ${dir.name} » : ${fics.map(f=>f[0]).join(', ')}${dir.name!=='designs'?' ⚠️ ce n’est pas le dossier designs (Maj+clic pour changer)':''}`)}
 catch(x){if(x&&x.name==='AbortError')return toast('Enregistrement annulé');for(const[n,b]of fics){const a=el('a',{href:URL.createObjectURL(b),download:n});document.body.append(a);a.click();a.remove()}toast('Fichiers téléchargés : déplace-les dans Thomas OS projet\\studio\\designs')}}
$('#bSave').onclick=enregistrer;

snap=JSON.stringify(D());majUI();boutonsEtat();inspecteur();polices();rendre();setInterval(rendre,30000);
