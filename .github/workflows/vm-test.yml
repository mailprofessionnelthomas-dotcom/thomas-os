---
# Test de démarrage : installe Thomas OS sur le disque d'une machine virtuelle (sur GitHub, jamais sur un PC),
# la démarre (UEFI), vérifie le système, ouvre une 1re session comme sur un vrai PC, et prend des photos.
# Compte de test, clé SSH et mot de passe sont jetables : ils n'existent que dans ce disque de test.
name: Test de démarrage (VM)
on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Version à tester (testing, ou un numéro AAAAMMJJ.N)"
        default: testing

permissions:
  contents: read

jobs:
  vm:
    name: Démarrage dans une machine virtuelle
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash  # = bash -eo pipefail : une vérification ratée fait échouer l'étape, même derrière « tee »
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/thomas-os:${{ inputs.image_tag }}
      SSH: ssh -i vm_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o LogLevel=ERROR root@127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Outils (QEMU, UEFI, KVM)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf python3-pil >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm /usr/share/OVMF/

      - name: Clé et mot de passe jetables
        run: |
          ssh-keygen -q -t ed25519 -N '' -f vm_key
          MDP="$(openssl rand -hex 12)"
          echo "::add-mask::${MDP}"
          echo "MDP=${MDP}" >> "${GITHUB_ENV}"

      # Installation par bootc lui-même (comme un vrai PC), sur un disque virtuel de 40 Go.
      # (bootc-image-builder/osbuild est bloqué par AppArmor sur les runners Ubuntu : essayé, abandonné)
      - name: Installer Thomas OS sur le disque de la VM
        run: |
          sudo podman pull -q "${IMAGE}"
          truncate -s 40G disque.raw
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t --security-opt apparmor=unconfined \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v "$PWD:/sortie" \
            "${IMAGE}" bootc install to-disk --via-loopback --generic-image --filesystem btrfs \
              --root-ssh-authorized-keys /sortie/vm_key.pub --karg systemd.wants=sshd.service \
              /sortie/disque.raw || { sudo dmesg | grep -iE 'apparmor|denied' | tail -15; exit 1; }
          sudo chown "$(id -u):$(id -g)" disque.raw

      - name: Démarrer la VM
        run: |
          DISQUE=disque.raw
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          mkdir -p resultats
          qemu-system-x86_64 -enable-kvm -cpu host -smp 4 -m 6144 -machine q35 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file="${DISQUE}",if=virtio,format=raw \
            -device virtio-vga -display none \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n0 \
            -monitor unix:/tmp/qemu-mon,server,nowait -serial file:resultats/console.log -daemonize
          for i in $(seq 120); do
            ${SSH} true 2>/dev/null && { echo "VM joignable après $((i * 5)) s"; exit 0; }
            sleep 5
          done
          echo "::error::La VM ne répond pas après 10 min"
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/0-bloque.png || true
          tail -40 resultats/console.log
          exit 1

      - name: Vérifier le système démarré
        run: |
          bash ci/vm/dans-la-vm.sh demarrage | tee resultats/rapport.txt
          sleep 10
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/1-connexion.png

      - name: 1re ouverture de session
        run: |
          bash ci/vm/dans-la-vm.sh preparer | tee -a resultats/rapport.txt
          sleep 30
          for i in $(seq 60); do ${SSH} true 2>/dev/null && break; sleep 5; done
          bash ci/vm/dans-la-vm.sh session | tee -a resultats/rapport.txt
          sleep 15
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/2-bureau.png
          bash ci/vm/dans-la-vm.sh situation | tee -a resultats/rapport.txt
          sleep 2
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/3-fenetre-notification.png
          bash ci/vm/dans-la-vm.sh menu | tee -a resultats/rapport.txt
          sleep 3
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/4-menu.png
          # le même menu, mais avec le vrai clavier : Alt+Espace (KRunner doit rester sur Alt+F2)
          python3 ci/vm/touches.py /tmp/qemu-mon esc
          sleep 2
          bash ci/vm/dans-la-vm.sh avant-alt-espace | tee -a resultats/rapport.txt
          python3 ci/vm/touches.py /tmp/qemu-mon alt-spc
          sleep 4
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/4b-alt-espace.png
          bash ci/vm/dans-la-vm.sh apres-alt-espace | tee -a resultats/rapport.txt
          python3 ci/vm/touches.py /tmp/qemu-mon esc

      - name: Thomas Core et Thomas Control
        run: |
          bash ci/vm/dans-la-vm.sh core | tee -a resultats/rapport.txt
          bash ci/vm/dans-la-vm.sh control | tee -a resultats/rapport.txt
          sleep 2
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/5-thomas-control.png

      # Studio : un style modifié par Thomas Core, sa maquette, puis le même style appliqué pour de vrai
      # (photo comparée à la maquette), et « Annuler » qui remet le style d'avant
      - name: Thomas Studio
        run: |
          bash ci/vm/dans-la-vm.sh studio | tee -a resultats/rapport.txt
          sleep 2
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/6-thomas-studio.png
          ${SSH} cat /tmp/maquette-essai-vm.png > resultats/7-maquette-du-studio.png
          bash ci/vm/dans-la-vm.sh style-studio | tee -a resultats/rapport.txt
          sleep 2
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/8-style-du-studio-applique.png
          bash ci/vm/dans-la-vm.sh annuler | tee -a resultats/rapport.txt
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/9-apres-annuler.png
          python3 - <<'EOF'
          # maquette à gauche, vrai bureau à droite (même hauteur)
          from PIL import Image
          a = Image.open("resultats/7-maquette-du-studio.png").convert("RGB")
          b = Image.open("resultats/8-style-du-studio-applique.png").convert("RGB")
          h = 400
          a, b = (i.resize((round(i.width * h / i.height), h)) for i in (a, b))
          c = Image.new("RGB", (a.width + b.width + 8, h), (255, 255, 255))
          c.paste(a, (0, 0))
          c.paste(b, (a.width + 8, 0))
          c.save("resultats/comparaison-maquette-vrai.jpg", quality=85)
          EOF

      - name: Installation automatique des applis (information)
        continue-on-error: true
        timeout-minutes: 15
        run: bash ci/vm/dans-la-vm.sh applis | tee -a resultats/rapport.txt

      - name: Résumé
        if: always()
        run: |
          { echo "## Test de démarrage (${{ inputs.image_tag }})"; echo '```'; cat resultats/rapport.txt 2>/dev/null || echo "pas de rapport (la VM n'a pas démarré)"; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
          tail -c 200000 resultats/console.log > resultats/console-fin.log 2>/dev/null || true
          rm -f resultats/console.log

      - name: Envoyer les résultats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-vm
          path: resultats
          retention-days: 14
