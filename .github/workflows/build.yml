---
# Construit les 3 variantes de Thomas OS et les publie sur ghcr.io.
#
# Chemin d'une mise à jour :
#   1. build      : construit les 3 images, chacune publiée sous un numéro de version unique (ex. 20261122.5)
#   2. vm_test    : la version est installée et démarrée dans une machine virtuelle (vm-test.yml)
#   3. testing    : si tout est vert, la version devient "testing" (le canal du PC de Thomas)
#   4. stable     : UNIQUEMENT à la main, avec le workflow "Passer en stable" (promote-stable.yml)
# Ce workflow ne touche JAMAIS au canal "stable".
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # tous les jours à 10h05 UTC : récupère les mises à jour de Bazzite
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'captures/**'
      - 'studio/**'
      - 'ci/banc/**'
      - 'ci/vm/**'
      - '.github/workflows/captures.yml'
      - '.github/workflows/vm-test.yml'
      - 'iso/**'
      - '.github/workflows/iso.yml'
      - 'ci/cle/**'
      - 'ci/inspecter/**'
      - 'ci/verifier-workflows.py'
      - '.github/workflows/test-installation.yml'
      - '.github/workflows/inspecter.yml'
      - '.github/workflows/publier-cle.yml'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Numéro de version
    runs-on: ubuntu-26.04
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version = date + numéro du build
        id: version
        run: |
          VERSION="$(date -u +%Y%m%d).${{ github.run_number }}"
          echo "Version : ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  # Vérifie que chaque appli de la liste existe bien sur Flathub (faute de frappe = build rouge)
  check_apps:
    name: Vérifier la liste des applis
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Chaque appli existe sur Flathub
        run: |
          set -euo pipefail
          fail=0
          while IFS=/ read -r kind app_id arch branch; do
            if [[ "${kind}" == "app" ]]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 "https://flathub.org/api/v2/appstream/${app_id}")"
              if [[ "${code}" == "200" ]]; then echo "OK      ${app_id}"; else echo "ABSENT  ${app_id} (HTTP ${code})"; fail=1; fi
            else
              # runtimes/extensions : on vérifie la présence de la référence dans le dépôt Flathub
              echo "runtime ${app_id}//${branch} (vérifié à l'installation)"
            fi
          done < <(grep -Ev '^[[:space:]]*(#|$)' system_files/usr/share/thomas-os/flatpaks.list)
          exit "${fail}"

  build_push:
    name: Build ${{ matrix.image_name }}
    needs: prepare
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LOCAL_TAG: candidate

    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD (Radeon), Intel (iGPU, Arc) et très vieilles NVIDIA (pilote libre nouveau)
          - image_name: thomas-os
            base_image: ghcr.io/ublue-os/bazzite:stable
            gpu: amd-intel
          # NVIDIA récentes : GTX 16xx, RTX 20, 30, 40, 50 (pilote NVIDIA open)
          - image_name: thomas-os-nvidia
            base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable
            gpu: nvidia
          # NVIDIA anciennes : GTX 750 Ti, GTX 900, GTX 1000, Titan V (pilote NVIDIA LTS)
          - image_name: thomas-os-nvidia-legacy
            base_image: ghcr.io/ublue-os/bazzite-nvidia:stable
            gpu: nvidia-legacy

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            "${IMAGE_NAME}" \
            "${LOCAL_TAG}" \
            "${{ matrix.base_image }}" \
            "${{ matrix.gpu }}" \
            "${VERSION}"

      # Découpe l'image en morceaux : mises à jour plus petites à télécharger
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            "${IMAGE_NAME}" \
            "${LOCAL_TAG}"

      # Vérifie dans l'image construite que c'est bien Thomas OS, avec la bonne variante
      - name: Check image content
        run: |
          set -euxo pipefail
          podman run --rm --entrypoint /usr/bin/bash "localhost/${IMAGE_NAME}:${LOCAL_TAG}" -c '
            set -euxo pipefail
            grep "^NAME=\"Thomas OS\"" /usr/lib/os-release
            grep "^THOMAS_OS_GPU_VARIANT=${{ matrix.gpu }}$" /usr/share/thomas-os/info.env
            grep "^THOMAS_OS_IMAGE_NAME=${{ matrix.image_name }}$" /usr/share/thomas-os/info.env
            grep "^THOMAS_OS_VERSION=${{ env.VERSION }}$" /usr/share/thomas-os/info.env
            jq -e ".\"image-name\" == \"${{ matrix.image_name }}\"" /usr/share/ublue-os/image-info.json
            jq -e ".\"image-tag\" == \"stable\"" /usr/share/ublue-os/image-info.json
          '

      # Pull requests never publish anything
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publie la version sous son numéro unique uniquement (ni "testing" ni "stable")
      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        run: |
          set -euox pipefail
          podman tag "localhost/${IMAGE_NAME}:${LOCAL_TAG}" "localhost/${IMAGE_NAME}:${VERSION}"
          podman push --digestfile=/tmp/digestfile "localhost/${IMAGE_NAME}:${VERSION}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # Signature "keyless" (Sigstore) : prouve que l'image vient bien de ce repo GitHub,
      # sans clé secrète à créer ni à garder. La signature suit l'image quand elle change de canal.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

  # Test de démarrage : installe la version sur le disque d'une VM, la démarre, ouvre une 1re session.
  # S'il échoue, la version n'est PAS publiée sur testing (règle : tester en VM avant le matériel réel).
  vm_test:
    name: Test de démarrage (VM)
    needs: [prepare, build_push]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: ./.github/workflows/vm-test.yml
    with:
      image_tag: ${{ needs.prepare.outputs.version }}

  # Banc d'essai : photos du vrai bureau KDE (chaque style + chaque design du Studio). Ne bloque rien.
  captures:
    name: Captures du vrai bureau
    needs: [prepare, build_push]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: ./.github/workflows/captures.yml
    with:
      image_tag: ${{ needs.prepare.outputs.version }}

  publish_testing:
    name: Publier sur le canal test
    needs: [prepare, check_apps, build_push, vm_test]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Tout ou rien : ce job ne tourne que si les 3 variantes ont réussi.
      # La même image (même empreinte, même signature) reçoit l'étiquette "testing", sans reconstruction.
      - name: Version -> testing (3 variantes)
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          REGISTRY="${IMAGE_REGISTRY,,}"
          echo "${GH_TOKEN}" | skopeo login ghcr.io -u "${GH_ACTOR}" --password-stdin
          {
            echo "## Version ${VERSION} publiée sur le canal **test**"
            echo ""
            echo "| Image | Empreinte |"
            echo "|---|---|"
          } >> "${GITHUB_STEP_SUMMARY}"
          for img in thomas-os thomas-os-nvidia thomas-os-nvidia-legacy; do
            digest="$(skopeo inspect --format '{{.Digest}}' "docker://${REGISTRY}/${img}:${VERSION}")"
            skopeo copy --all --preserve-digests \
              "docker://${REGISTRY}/${img}@${digest}" \
              "docker://${REGISTRY}/${img}:testing"
            echo "| ${img} | \`${digest}\` |" >> "${GITHUB_STEP_SUMMARY}"
          done
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Pour la passer en **stable** : onglet Actions → « Passer en stable » → Run workflow." >> "${GITHUB_STEP_SUMMARY}"
