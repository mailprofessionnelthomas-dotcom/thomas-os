---
# Clé USB de Thomas OS : fabrique l'ISO (session live + installateur), la teste dans une machine virtuelle AVEC
# Secure Boot activé, puis la publie dans une Release, découpée en morceaux de moins de 2 Go (limite de GitHub)
# avec « Assembler-ISO.cmd » pour la recoller sous Windows. Tout se passe sur GitHub, jamais sur un PC.
# Méthode de Bazzite : image « installateur » (iso/) + ublue-os/titanoboa.
name: Clé USB (ISO)
on:
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal suivi par le PC installé (testing ou stable)"
        default: testing
      variante:
        description: "thomas-os (AMD/Intel), thomas-os-nvidia ou thomas-os-nvidia-legacy"
        default: thomas-os
      publier:
        description: "Publier dans une Release si le test Secure Boot passe"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: iso-${{ inputs.variante }}-${{ inputs.canal }}
  cancel-in-progress: true

jobs:
  construire:
    name: Fabriquer l'ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    outputs:
      nom: ${{ steps.refs.outputs.nom }}
      version: ${{ steps.refs.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Faire de la place
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: true

      # comme Bazzite : stockage des conteneurs sur un disque btrfs compressé (l'image + l'image à installer)
      - name: Stockage des conteneurs
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true

      - name: Image et version
        id: refs
        env:
          CANAL: ${{ inputs.canal }}
          VARIANTE: ${{ inputs.variante }}
        run: |
          [[ "${CANAL}" =~ ^(testing|stable)$ ]] || { echo "::error::canal inconnu : ${CANAL}"; exit 1; }
          [[ "${VARIANTE}" =~ ^thomas-os(-nvidia|-nvidia-legacy)?$ ]] || { echo "::error::variante inconnue : ${VARIANTE}"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${VARIANTE}:${CANAL}"
          sudo podman pull -q "${image}"
          version="$(sudo podman run --rm --entrypoint cat "${image}" /usr/share/thomas-os/info.env | sed -n 's/^THOMAS_OS_VERSION=//p')"
          [[ -n "${version}" ]] || { echo "::error::version introuvable dans ${image}"; exit 1; }
          echo "image=${image}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "nom=${VARIANTE}-${CANAL}-${version}.iso" >>"${GITHUB_OUTPUT}"
          echo "Image ${image}, version ${version}"

      - name: Image installateur (session live + Anaconda)
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
        run: |
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE_IMAGE="${IMAGE}" --build-arg INSTALL_IMAGE_PAYLOAD="${IMAGE}" \
            -t localhost/thomas-os-installateur:latest iso/

      - name: Fabriquer l'ISO (titanoboa)
        id: iso
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/thomas-os-installateur:latest
          iso-dest: ${{ steps.refs.outputs.nom }}  # un simple nom : titanoboa veut un dossier qui existe déjà

      - name: Taille et empreinte
        env:
          ISO: ${{ steps.iso.outputs.iso-dest }}
        run: |
          mkdir -p sortie
          mv "${ISO}" sortie/
          ls -lh sortie/
          (cd sortie && sha256sum ./*.iso | tee SHA256SUMS)
          df -h / /mnt

      - name: Garder l'ISO pour le test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso
          path: sortie
          retention-days: 3
          compression-level: 0

  tester:
    name: Démarrer la clé avec Secure Boot (VM)
    needs: construire
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Récupérer l'ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: sortie

      - name: Outils (QEMU, UEFI avec Secure Boot, KVM)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf python3-pil >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /usr/share/OVMF/

      # UEFI avec les clés de Microsoft et Secure Boot activé, comme un PC du commerce
      - name: Démarrer la clé
        env:
          NOM: ${{ needs.construire.outputs.nom }}
        run: |
          mkdir -p resultats
          cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd vars.fd
          qemu-img create -q -f qcow2 disque.qcow2 64G
          qemu-system-x86_64 -enable-kvm -cpu host -smp 4 -m 8192 \
            -machine q35,smm=on -global driver=cfi.pflash01,property=secure,value=on \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -drive file="sortie/${NOM}",media=cdrom,readonly=on,if=none,id=cle -device ide-cd,drive=cle,bootindex=0 \
            -drive file=disque.qcow2,if=virtio,format=qcow2 \
            -device virtio-vga -display none -serial file:resultats/serie.log \
            -monitor unix:/tmp/qemu-mon,server,nowait -daemonize
          sleep 12
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/1-menu-de-demarrage.png

      - name: Attendre la session live
        run: |
          for i in $(seq 48); do
            grep -q 'THOMAS-LIVE:' resultats/serie.log && break
            sleep 15
            (( i % 8 == 0 )) && python3 ci/vm/photo.py /tmp/qemu-mon "resultats/2-attente-$((i / 4)).png"
          done
          sleep 5
          python3 ci/vm/photo.py /tmp/qemu-mon resultats/3-session-live.png
          ligne="$(grep -a 'THOMAS-LIVE:' resultats/serie.log | tail -1)"
          { echo "## Clé USB ${{ needs.construire.outputs.nom }}"; echo '```'; echo "${ligne:-pas de session live au bout de 12 min}"; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
          echo "${ligne}"
          [[ "${ligne}" == *"secureboot=SecureBoot enabled"* ]] || { echo "::error::Secure Boot pas actif (ou session live pas prête)"; exit 1; }
          [[ "${ligne}" =~ plasma=[1-9] ]] || { echo "::error::bureau live absent"; exit 1; }
          [[ "${ligne}" =~ installateur=[1-9] ]] || { echo "::error::installateur pas ouvert"; exit 1; }
          echo "OK : la clé démarre avec Secure Boot activé, bureau live et installateur ouverts"

      - name: Envoyer les photos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-cle-usb
          path: resultats
          retention-days: 14

  # Installation complète, comme sur un vrai PC : clé démarrée avec Secure Boot, installateur (mêmes réglages,
  # sans interface), 1er redémarrage avec l'écran bleu MOK passé au clavier, puis le système installé démarre
  # avec Secure Boot. Le mot de passe et la clé SSH du compte de test sont jetables.
  installer:
    name: Installer pour de vrai (VM, Secure Boot, écran MOK)
    needs: construire
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      MON: /tmp/qemu-mon
      SSH: ssh -i vm_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o LogLevel=ERROR testeur@127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Faire de la place
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Récupérer l'ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: sortie

      - name: Outils (QEMU, UEFI avec Secure Boot, KVM)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf python3-pil >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compte de test jetable (kickstart)
        run: |
          ssh-keygen -q -t ed25519 -N '' -f vm_key
          MDP="$(openssl rand -hex 12)"
          echo "::add-mask::${MDP}"
          cat >test.ks <<EOF
          # Installation automatique de test : mêmes réglages que l'installateur de la clé (fichier inclus ci-dessous)
          lang fr_FR.UTF-8
          keyboard --vckeymap=fr --xlayouts='fr'
          timezone Europe/Paris --utc
          zerombr
          clearpart --all --initlabel --disklabel=gpt
          autopart --type=btrfs --noswap
          rootpw --lock
          user --name=testeur --groups=wheel --password=${MDP} --plaintext
          sshkey --username=testeur "$(cat vm_key.pub)"
          %include /usr/share/anaconda/interactive-defaults.ks
          %post --erroronfail
          systemctl enable sshd.service
          %end
          %post --nochroot
          echo "THOMAS-INSTALL: post fini, clé Secure Boot en attente : \$(mokutil --list-new 2>/dev/null | grep -c 'Subject:')" >/dev/ttyS0
          %end
          poweroff
          EOF
          mkdir -p resultats

      - name: Démarrer la clé (Secure Boot) et ouvrir la console série
        env:
          NOM: ${{ needs.construire.outputs.nom }}
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd vars.fd
          qemu-img create -q -f qcow2 disque.qcow2 64G
          qemu-system-x86_64 -enable-kvm -cpu host -smp 4 -m 8192 \
            -machine q35,smm=on -global driver=cfi.pflash01,property=secure,value=on \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -drive file="sortie/${NOM}",media=cdrom,readonly=on,if=none,id=cle -device ide-cd,drive=cle,bootindex=0 \
            -drive file=disque.qcow2,if=virtio,format=qcow2,bootindex=1 \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -device virtio-vga -display none -serial unix:/tmp/serie.sock,server,nowait \
            -monitor unix:${MON},server,nowait -pidfile qemu.pid -daemonize
          # menu de démarrage : arrêter le compte à rebours, puis ajouter la console série (ce test seulement)
          for _ in $(seq 14); do python3 ci/vm/touches.py "${MON}" up >/dev/null; done
          python3 ci/vm/photo.py "${MON}" resultats/1-menu-de-demarrage.png
          python3 ci/vm/touches.py "${MON}" e
          sleep 1
          python3 ci/vm/touches.py "${MON}" end "texte: console=ttyS0,115200 console=tty0"
          python3 ci/vm/photo.py "${MON}" resultats/2-menu-modifie.png
          python3 ci/vm/touches.py "${MON}" ctrl-x

      - name: Installer
        run: |
          python3 ci/cle/serie.py /tmp/serie.sock resultats/serie-live.log test.ks | tee resultats/rapport.txt
          for _ in $(seq 60); do kill -0 "$(cat qemu.pid)" 2>/dev/null || break; sleep 5; done
          if kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            python3 ci/vm/photo.py "${MON}" resultats/3-pas-eteint.png
            echo "::error::la VM ne s'est pas éteinte après l'installation"; exit 1
          fi
          echo "OK      la VM s'est éteinte à la fin de l'installation" | tee -a resultats/rapport.txt

      - name: 1er démarrage du système installé (écran MOK)
        run: |
          qemu-system-x86_64 -enable-kvm -cpu host -smp 4 -m 6144 \
            -machine q35,smm=on -global driver=cfi.pflash01,property=secure,value=on \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -drive file=disque.qcow2,if=virtio,format=qcow2 \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n0 \
            -device virtio-vga -display none -serial file:resultats/serie-installe.log \
            -monitor unix:${MON},server,nowait -pidfile qemu.pid -daemonize
          sleep 25
          python3 ci/vm/photo.py "${MON}" resultats/4-ecran-mok.png
          # comme l'indique le guide : une touche, « Enroll MOK », « Continue », « Yes », mot de passe, « Reboot »
          python3 ci/vm/touches.py "${MON}" ret; sleep 2
          python3 ci/vm/photo.py "${MON}" resultats/5-mok-menu.png
          python3 ci/vm/touches.py "${MON}" down ret; sleep 2
          python3 ci/vm/photo.py "${MON}" resultats/6-mok-cle.png
          python3 ci/vm/touches.py "${MON}" down ret; sleep 2
          python3 ci/vm/photo.py "${MON}" resultats/7-mok-confirmer.png
          python3 ci/vm/touches.py "${MON}" down ret; sleep 2
          python3 ci/vm/touches.py "${MON}" "texte:secureboot" ret; sleep 3
          python3 ci/vm/photo.py "${MON}" resultats/8-mok-fini.png
          python3 ci/vm/touches.py "${MON}" ret
          for i in $(seq 80); do ${SSH} true 2>/dev/null && { echo "système installé joignable après $((i * 5)) s"; break; }; sleep 5; done
          sleep 20
          python3 ci/vm/photo.py "${MON}" resultats/9-systeme-installe.png

      - name: Vérifier le système installé
        run: |
          erreurs=0
          ok() { echo "OK      $*" | tee -a resultats/rapport.txt; }
          ko() { echo "ECHEC   $*" | tee -a resultats/rapport.txt; erreurs=$((erreurs + 1)); }
          sb="$(${SSH} mokutil --sb-state 2>&1)"
          if [[ "${sb}" == *"SecureBoot enabled"* ]]; then ok "le système installé démarre avec Secure Boot activé"; else ko "Secure Boot : ${sb:-pas de réponse (le système n'a pas démarré ?)}"; fi
          cles="$(${SSH} mokutil --list-enrolled 2>&1 | grep -E 'Subject:|CN=' | head -4)"
          if [[ -n "${cles}" ]]; then ok "clé Secure Boot de Thomas OS enregistrée (écran MOK) : $(echo "${cles}" | head -1 | xargs)"; else ko "aucune clé enregistrée par l'écran MOK"; fi
          if ${SSH} grep -q '^NAME="Thomas OS"' /usr/lib/os-release; then ok "c'est bien Thomas OS"; else ko "os-release"; fi
          suivi="$(${SSH} rpm-ostree status --booted --json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["deployments"][0].get("container-image-reference",""))')"
          if [[ "${suivi}" == *thomas-os:${{ inputs.canal }}* ]]; then ok "mises à jour : suit ${suivi}"; else ko "image suivie : ${suivi:-?}"; fi
          if ${SSH} systemctl is-active --quiet display-manager; then ok "écran de connexion lancé"; else ko "écran de connexion absent"; fi
          ${SSH} systemctl --failed --no-legend --plain 2>/dev/null | awk '{print "INFO    service en échec : " $1}' | tee -a resultats/rapport.txt
          { echo "## Installation complète (${{ needs.construire.outputs.nom }})"; echo '```'; cat resultats/rapport.txt; echo '```'; } >>"${GITHUB_STEP_SUMMARY}"
          exit $((erreurs > 0))

      - name: Envoyer les photos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-installation
          path: resultats
          retention-days: 14

  publier:
    name: Publier (Release en morceaux)
    needs: [construire, tester, installer]
    if: inputs.publier
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Récupérer l'ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: sortie

      - name: Découper + Assembler-ISO.cmd
        env:
          NOM: ${{ needs.construire.outputs.nom }}
        run: |
          mkdir -p cle
          (cd sortie && sha256sum -c SHA256SUMS)
          somme="$(cut -d' ' -f1 sortie/SHA256SUMS)"
          split -b 1900M -d -a 2 "sortie/${NOM}" "cle/${NOM}.part"
          parts=(); for p in cle/*.part*; do parts+=("\"$(basename "${p}")\""); done
          liste="$(IFS=+; echo "${parts[*]}")"
          {
            echo '@echo off'
            echo 'chcp 65001 >nul'
            echo 'cd /d "%~dp0"'
            echo 'echo Thomas OS : assemblage de la clé USB (quelques minutes)...'
            echo "copy /b ${liste} \"${NOM}\" >nul"
            echo 'if errorlevel 1 (echo ERREUR : un morceau manque, retélécharge-les tous dans le même dossier. & pause & exit /b 1)'
            echo 'echo Vérification du fichier...'
            echo "certutil -hashfile \"${NOM}\" SHA256 | findstr /i \"${somme}\" >nul"
            echo "if errorlevel 1 (echo ERREUR : le fichier est abîmé, retélécharge les morceaux. & pause & exit /b 1)"
            echo "echo OK : ${NOM} est complet et intact. Tu peux supprimer les fichiers .part."
            echo 'pause'
          } | sed 's/$/\r/' >cle/Assembler-ISO.cmd
          cp sortie/SHA256SUMS cle/
          ls -lh cle/

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOM: ${{ needs.construire.outputs.nom }}
          VERSION: ${{ needs.construire.outputs.version }}
          CANAL: ${{ inputs.canal }}
        run: |
          tag="cle-usb-${{ inputs.variante }}-${CANAL}-${VERSION}-n${GITHUB_RUN_NUMBER}"
          {
            echo "Clé USB de Thomas OS **${VERSION}** (${{ inputs.variante }}, canal ${CANAL}). Testée dans une machine virtuelle avec Secure Boot activé : démarrage de la clé, installation complète, écran MOK, puis 1er démarrage du système installé."
            echo
            echo "1. Télécharge **tous** les fichiers \`.part\` et \`Assembler-ISO.cmd\` dans un même dossier."
            echo "2. Double-clique sur \`Assembler-ISO.cmd\` : il recolle \`${NOM}\` et vérifie qu'il est intact."
            echo "3. Écris l'ISO sur une clé USB avec un outil graphique, puis installe : guide pas à pas dans [docs/INSTALLATION.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALLATION.md)."
            echo
            echo "Empreinte SHA-256 de l'ISO : \`$(cut -d' ' -f1 cle/SHA256SUMS)\`"
          } >notes.md
          gh release create "${tag}" cle/* --title "Clé USB Thomas OS ${VERSION} (${CANAL})" --notes-file notes.md --target "${GITHUB_SHA}"
          echo "Release : https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" | tee -a "${GITHUB_STEP_SUMMARY}"
