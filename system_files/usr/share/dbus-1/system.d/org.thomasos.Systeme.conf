<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Thomas OS : seul root possède l'aide système ; tout le monde peut l'appeler (chaque action est
     ensuite autorisée ou refusée par polkit, dans le service). -->
<busconfig>
  <policy user="root">
    <allow own="org.thomasos.Systeme"/>
    <allow send_destination="org.thomasos.Systeme"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.thomasos.Systeme"/>
  </policy>
</busconfig>
