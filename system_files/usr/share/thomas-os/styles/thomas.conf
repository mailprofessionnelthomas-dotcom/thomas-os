# Style « Thomas OS » : le style installé par défaut. Identité du 23/11/2026 (master prompt) :
# noir profond, anthracite, rouge, blanc ; barre flottante en capsule noire à bordure rouge fine.
# Les couleurs, rayons et l'épaisseur de barre viennent de identite/tokens.json (le build vérifie qu'ils sont identiques).
# Toutes les valeurs se changent. Pour ta version perso : thomas-style code thomas   (ne modifie pas ce fichier-ci)

[style]
nom = Thomas OS
description = Noir profond et rouge, barre flottante en capsule, fond abstrait avec le grand T

[couleurs]
principale = #ff0000
barre = #08080a
fenetres = #16171b
texte = #f4f4f6
bordure = #ff0000
# fond_haut / fond_bas : servent seulement si l'image de fond manque
fond_haut = #1a0003
fond_bas = #050506

[effets]
# opacite : barre (10 à 100) ; opacite_menus : menus, notifications, widgets
opacite = 100
opacite_menus = 92
flou = 0
# coins : barre (20 = capsule pour une barre de 40 px) ; coins_menus : menus et bulles
coins = 20
coins_menus = 12
epaisseur_bordure = 1
# animations : rapides (~120 ms), normales ou aucune
animations = rapides

[barre]
epaisseur = 40
disposition = float

[texte]
# police : manrope, open, outfit, nunito, plex, rajdhani, mono
police = manrope
taille = 12
epaisseur_texte = 300

[bureau]
horloge = oui
fond = image
fond_image = /usr/share/wallpapers/ThomasOS/contents/images/2560x1440.png

[fenetres]
coins = 8
