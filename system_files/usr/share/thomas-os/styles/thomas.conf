# Style « Thomas OS » : le style installé par défaut (choix de Thomas, 22/11/2026).
# Toutes les valeurs se changent. Couleurs au format #rrggbb.
# Pour ta version perso : thomas-style code thomas   (ne modifie pas ce fichier-ci)

[style]
nom = Thomas OS
description = Base Windows 11, rouge et noir, barre très transparente, police fine comme l'horloge

[couleurs]
principale = #ff0000
barre = #ff0000
fenetres = #000000
texte = #f2f5f9
fond_haut = #1f5f99
fond_bas = #08131f

[effets]
# opacite : barre des tâches (10 à 100) ; opacite_menus : menus et notifications
opacite = 15
opacite_menus = 85
flou = 0
coins = 8
# animations : rapides, normales ou aucune
animations = rapides

[barre]
# disposition : windows, macos, float ou vertical
epaisseur = 28
disposition = windows

[texte]
# police : manrope, open, outfit, nunito, plex, rajdhani, mono
police = manrope
taille = 12
epaisseur_texte = 300

[bureau]
horloge = oui
