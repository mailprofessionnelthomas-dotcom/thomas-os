# Mode jeu automatique : comment reconnaître un jeu en cours.
# Une expression par ligne, cherchée dans la ligne de commande des programmes (comme « pgrep -f »).
# Steam (jeux natifs et Proton)
SteamLaunch AppId=
# Lutris
lutris-wrapper
# Heroic (Epic, GOG, Amazon)
(legendary|gogdl|nile) launch
# Sober (Roblox)
org\.vinegarhq\.Sober
# Prism Launcher (Minecraft)
org\.prismlauncher\.EntryPoint|net\.minecraft\.client
# Gamescope (session de jeu)
^gamescope
